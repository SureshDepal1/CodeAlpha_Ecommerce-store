{% extends "base.html" %}

{% block title %}Page Not Found | Simple E-commerce Store{% endblock %}

{% block content %}
<main class="error-page">
    <div class="container error-page__content">
        <p class="eyebrow">404 error</p>
        <h1>Page not found.</h1>
        <p>We could not find the page you were looking for.</p>
        <div class="error-page__actions">
            <a class="button" href="{% url 'store:product_list' %}">Browse Products</a>
            <a class="button button--secondary" href="{% url 'store:home' %}">Return Home</a>
        </div>
    </div>
</main>
{% endblock %}
